services:
  - type: web
    name: library-management-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker: the JSON file store is not safe for several processes writing at once.
    startCommand: gunicorn wsgi:app --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SEED_SAMPLE_DATA
        value: "true"
      - key: FINE_PER_DAY
        value: "2.00"
      - key: TIMEZONE
        value: Asia/Kolkata
