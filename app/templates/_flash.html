{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="flash-stack">
  {% for category, message in messages %}
  <div class="alert alert-{{ category if category in ('success','danger','warning','info') else 'info' }}" role="{{ 'alert' if category in ('danger','warning') else 'status' }}">{{ message }}</div>
  {% endfor %}
</div>
{% endif %}
{% endwith %}
